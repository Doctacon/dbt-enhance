[project]
name = "dbt-enhance"
version = "0.1.1"
description = "Run selected dbt SQL from Helix in a beautiful terminal popup"
readme = "README.md"
authors = [
    { name = "Connor", email = "connor@loughondata.com" }
]
requires-python = ">=3.12"
license = "MIT"
keywords = ["dbt", "helix", "sql", "textual", "tmux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Database :: Front-Ends",
]
dependencies = [
    "sqlparse>=0.5.3,<1",
    "textual>=1.0,<2",
    "tomlkit>=0.13,<1",
    "typer>=0.15,<1",
]

[project.scripts]
dbt-enhance = "dbt_enhance.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "dbt-duckdb>=1.9,<1.10",
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.11",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "README.md" },
    { file = "src/**/*.py" },
    { file = "src/**/*.tcss" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: executes dbt against an isolated local DuckDB database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
